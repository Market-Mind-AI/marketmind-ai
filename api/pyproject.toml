[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marketmind"
version = "0.1.0"
description = "MarketMind AI — generative-AI commercial-intelligence platform (Master's thesis MVP)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Miguel" }]
keywords = ["generative-ai", "market-intelligence", "ddd", "hexagonal", "clean-architecture"]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "Private :: Do Not Upload",
]

dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.32,<0.33",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy[asyncio]>=2.0.36,<2.1",
  "asyncpg>=0.30,<0.31",
  "pgvector>=0.3.6,<0.4",
  "anthropic>=0.40,<1",
  "cohere>=5.13,<6",
  "httpx>=0.28,<0.29",
  "sse-starlette>=2.1,<3",
  "python-multipart>=0.0.18,<0.1",
  "structlog>=24.4,<25",
]

[project.optional-dependencies]
pdf = ["weasyprint>=63,<64"]

[project.scripts]
marketmind = "marketmind.main:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<0.25",
  "ruff>=0.8,<0.9",
  "mypy>=1.13,<2",
  "import-linter>=2.1,<3",
  "alembic>=1.14,<2",
]

# ---------------------------------------------------------------------------
# src layout: the importable package lives at api/src/marketmind
# ---------------------------------------------------------------------------
[tool.hatch.build.targets.wheel]
packages = ["src/marketmind"]

# ---------------------------------------------------------------------------
# Ruff — lint + format
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "N",    # pep8-naming
  "UP",   # pyupgrade
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "SIM",  # flake8-simplify
  "TID",  # flake8-tidy-imports
  "RUF",  # ruff-specific
]
ignore = [
  "B008",   # function call in argument defaults (FastAPI Depends pattern)
  "N818",   # domain/application exceptions use DDD ubiquitous-language names (InvalidStateTransition, AnalysisNotFound), not an -Error suffix
  "RUF001", # user-facing strings/HTML intentionally use typographic en-dashes "–"
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["N802", "N803", "N806"]

[tool.ruff.lint.isort]
known-first-party = ["marketmind"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# mypy — strict-ish
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_any_generics = true
no_implicit_reexport = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = ["pgvector.*", "cohere.*", "weasyprint.*"]
ignore_missing_imports = true

# The infrastructure (framework adapter) layer is not held to strict
# untyped-def rules: it wires up FastAPI/SQLAlchemy/SDK callables (whose own
# stubs are loosely typed) where exhaustive annotation buys little. Domain and
# application stay fully strict.
[[tool.mypy.overrides]]
module = ["marketmind.infrastructure.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_any_generics = false
disallow_untyped_calls = false
warn_return_any = false

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_any_generics = false
disallow_untyped_calls = false
warn_return_any = false
# Tests wire structural fakes through invariant containers and exercise
# post-mutation aggregate state mypy can't narrow — accepted in the test layer.
disable_error_code = ["arg-type", "comparison-overlap"]

# pytest puts the test root on sys.path, so `import conftest` resolves at
# runtime; mypy doesn't model that.
[[tool.mypy.overrides]]
module = ["conftest"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra -q"

# ---------------------------------------------------------------------------
# import-linter — enforce the dependency rule (infra -> application -> domain)
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "marketmind"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Clean Architecture layering (dependencies point inward only)"
type = "layers"
layers = [
  "marketmind.infrastructure",
  "marketmind.application",
  "marketmind.domain",
]

[[tool.importlinter.contracts]]
name = "Domain is pure: no third-party frameworks"
type = "forbidden"
source_modules = ["marketmind.domain"]
forbidden_modules = [
  "fastapi",
  "sqlalchemy",
  "pydantic",
  "pydantic_settings",
  "anthropic",
  "cohere",
  "httpx",
  "uvicorn",
  "sse_starlette",
  "structlog",
  "asyncpg",
  "pgvector",
  "langgraph",
]

[[tool.importlinter.contracts]]
name = "Application is framework-free: domain only, no third-party frameworks"
type = "forbidden"
source_modules = ["marketmind.application"]
forbidden_modules = [
  "fastapi",
  "sqlalchemy",
  "pydantic",
  "pydantic_settings",
  "anthropic",
  "cohere",
  "httpx",
  "uvicorn",
  "sse_starlette",
  "structlog",
  "asyncpg",
  "pgvector",
  "langgraph",
]
