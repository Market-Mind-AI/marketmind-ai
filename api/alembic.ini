# Alembic configuration for MarketMind AI.
#
# The database URL is intentionally NOT hard-coded here; migrations/env.py
# pulls it from Settings (env var MARKETMIND_DATABASE_URL), and converts the
# async asyncpg URL to a sync psycopg/pg8000-compatible URL for offline DDL or
# runs it through the async engine online. Override with `-x db_url=...`.

[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os
# version_locations is the single migrations/versions dir by default.

# Logging.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
