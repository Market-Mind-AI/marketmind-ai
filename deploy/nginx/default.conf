# nginx for the local compose deploy. Same as ../../nginx/default.conf (the
# image's own config) plus one thing: /api/ is proxied to the orchestrator, so
# the browser talks to its own origin and no CORS is involved — the deployed
# ingress does exactly this, and the orchestrator has no CORS middleware.
#
# Mounted over /etc/nginx/conf.d/default.conf by deploy/docker-compose.yml.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # POST /api/catalog/identify-image carries a base64 photo.
    client_max_body_size 25m;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # The orchestrator (compose service name, container port). The trailing
    # slash strips the /api prefix. The stream route is SSE: buffering off and
    # a long read timeout, or the browser sees nothing until the run ends.
    location /api/ {
        proxy_pass http://orchestrator:8000/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Astro's dynamic routes: served the placeholder document, the real id is
    # read client-side. Internal rewrite, never a redirect.
    location ^~ /report/ {
        try_files $uri $uri/ /report/_/index.html;
    }

    location ^~ /r/ {
        try_files $uri $uri/ /r/_/index.html;
    }

    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
