# Serves the Astro static build (astro.config.mjs sets output: "static").
#
# Port 8080, not 80: the base image is nginx-unprivileged, whose worker runs as
# uid 101 and therefore cannot bind a privileged port.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Kubernetes liveness/readiness target. A probe against "/" would work too,
    # but it would pull the whole document on every check and would go red for a
    # broken page rather than for a dead server.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Astro emits these two dynamic routes with a literal "_" segment, because
    # each page's getStaticPaths returns a single placeholder param
    # (params: { id: "_" } / { slug: "_" }) and the real value is read from
    # window.location client-side. So /report/abc123 has no file of its own and
    # must be served the placeholder document.
    #
    # This has to be an *internal* rewrite. A redirect would rewrite the address
    # bar to /report/_ and destroy the very id the page is about to read.
    location ^~ /report/ {
        try_files $uri $uri/ /report/_/index.html;
    }

    location ^~ /r/ {
        try_files $uri $uri/ /r/_/index.html;
    }

    # Content-hashed bundles — safe to cache hard, since a change produces a
    # new filename rather than new bytes at the same one.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # `try_files ... /404.html` would serve the right document with a 200 status,
    # which tells crawlers and uptime checks that a missing page is fine. Going
    # through error_page keeps the 404 status on the response.
    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # The HTML documents themselves must not be cached, or a browser keeps
    # loading an old document that references bundle filenames the new deploy
    # no longer serves.
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
